name: CNA Growth Forecast Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cna-forecast:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install additional forecasting dependencies
        pip install lightgbm xgboost prophet scikit-learn pandas numpy
      
    - name: Clone CVE data repository
      run: |
        git clone --depth 1 https://github.com/CVEProject/cvelistV5.git cve_data
        echo "CVE data cloned successfully"
        ls -la cve_data/
      
    - name: Run CNA Forecasting
      run: python ./cnascorecard_pipeline/cna_main.py
      
    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add web/cna_data.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated: Update CNA forecast data [skip ci]"
          git pull --rebase origin v.08
          git push
        fi
