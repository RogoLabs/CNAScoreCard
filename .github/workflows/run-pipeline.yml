name: Scheduled Data Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write
    
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: true
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'  # Enable pip caching for faster installs
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Cache CVE data repository
      id: cache-cve-data
      uses: actions/cache@v4
      with:
        path: cve_data
        key: cve-data-v1
        restore-keys: |
          cve-data-
    
    - name: Update CVE data repository
      run: |
        if [ -d "cve_data/.git" ]; then
          echo "Updating cached CVE data..."
          cd cve_data
          git fetch --depth=1 origin main
          git reset --hard origin/main
          cd ..
          echo "CVE data updated successfully"
        else
          echo "No cache found, cloning fresh..."
          rm -rf cve_data
          git clone --depth=1 https://github.com/CVEProject/cvelistV5.git cve_data
          echo "CVE data cloned successfully"
        fi
        ls -la cve_data/
      
    - name: Run the Data Pipeline
      run: python ./cnascorecard_pipeline/pipeline.py

    - name: Validate pipeline output
      run: |
        echo "Validating pipeline output..."
        for file in web/data/cna_combined.json web/data/field_utilization.json web/data/performance_trends.json; do
          if [ ! -f "$file" ]; then
            echo "ERROR: Missing expected output file: $file"
            exit 1
          fi
          python -c "import json; json.load(open('$file'))" || {
            echo "ERROR: Invalid JSON in $file"
            exit 1
          }
        done
        echo "All output files validated successfully"

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add web/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated: Update CNA Scorecard data [skip ci]"

          # Fetch latest and attempt to push
          git fetch origin main

          # Try to push, if it fails attempt rebase
          if ! git push origin HEAD:main; then
            echo "Push failed, attempting to rebase..."
            git pull origin main --rebase || {
              echo "ERROR: Could not rebase. Another workflow may be running."
              echo "This run will be retried on the next scheduled execution."
              exit 1
            }
            git push origin HEAD:main || {
              echo "ERROR: Push failed after rebase. Will retry on next run."
              exit 1
            }
          fi

          echo "Changes pushed successfully"
        fi
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './web'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
