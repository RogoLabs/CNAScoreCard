name: Scheduled Data Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write
    
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'  # Enable pip caching for faster installs
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Cache CVE data repository
      id: cache-cve-data
      uses: actions/cache@v4
      with:
        path: cve_data
        key: cve-data-${{ github.run_number }}
        restore-keys: |
          cve-data-
    
    - name: Update CVE data repository
      run: |
        if [ -d "cve_data/.git" ]; then
          echo "Updating cached CVE data..."
          cd cve_data
          git fetch --depth=1 origin main
          git reset --hard origin/main
          cd ..
          echo "CVE data updated successfully"
        else
          echo "No cache found, cloning fresh..."
          rm -rf cve_data
          git clone --depth=1 https://github.com/CVEProject/cvelistV5.git cve_data
          echo "CVE data cloned successfully"
        fi
        ls -la cve_data/
      
    - name: Run the Data Pipeline
      run: python ./cnascorecard_pipeline/pipeline.py 
      
    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add web/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated: Update CNA Scorecard data [skip ci]"
          
          # Fetch latest changes
          git fetch origin main
          
          # Try to push, if it fails due to conflicts, resolve them
          if ! git push origin HEAD:main; then
            echo "Push failed, attempting to resolve conflicts..."
            
            # Pull with merge strategy (not rebase) and auto-resolve conflicts
            # For data files, always prefer our version (the newer data)
            git pull origin main --no-rebase --strategy-option=ours || {
              echo "Merge had conflicts, resolving by keeping our changes..."
              
              # For any conflicted files in web/data/, accept our version
              git checkout --ours web/data/
              git add web/data/
              
              # Complete the merge
              git -c core.editor=true merge --continue || {
                echo "Could not auto-resolve, will force push our changes..."
                git merge --abort
                git push --force origin HEAD:main
                exit 0
              }
            }
            
            # Try pushing again
            git push origin HEAD:main || {
              echo "Still failed, force pushing..."
              git push --force origin HEAD:main
            }
          fi
          
          echo "Changes pushed successfully"
        fi
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './web'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
