<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVEs - CNA Scorecard</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="../leaderboard.css">
</head>
<body>
  <nav class="navbar">
    <img src="../assets/logo.svg" alt="CNA Scorecard Logo" class="navbar-logo">
    <div class="navbar-links">
      <a href="../index.html">Home</a>
      <a href="../cna/index.html">CNAs</a>
      <a href="index.html" class="active">CVEs</a>
      <a href="../completeness/index.html">Completeness</a>
      <a href="../scoring.html">Methodology</a>
    </div>
  </nav>
  <main class="container">
    <section class="contextual-heading-card card">
      <h1 class="contextual-heading-title">All CVEs</h1>
      <p class="contextual-heading-subtitle">Browse and explore all scored CVEs in the ecosystem.</p>
    </section>
    <section class="hero-section">
      <input type="search" id="searchBar" placeholder="Search CVE..." aria-label="Search CVE">
    </section>
    <section class="leaderboard-section">
      <div class="leaderboard-controls">
        <label for="sortSelect">Sort by:</label>
        <select id="sortSelect">
          <option value="score">Score</option>
          <option value="grade">Grade</option>
          <option value="cna">CNA</option>
        </select>
        <label><input type="checkbox" id="activeOnly"> Show only active CVEs</label>
      </div>
      <table class="leaderboard-table" id="leaderboardTable">
        <thead>
          <tr>
            <th>CVE ID</th>
            <th>Grade</th>
            <th>CNA</th>
          </tr>
        </thead>
        <tbody>
          <!-- CVE rows will be rendered here by cve-leaderboard.js -->
        </tbody>
      </table>
    </section>
  </main>
  <footer class="footer modern-footer">
    <div class="footer-main">
      <!-- Summary line will be injected here by summary-cards.js -->
      <div class="footer-brand">
        <img src="../assets/logo.svg" alt="CNA Scorecard Logo" class="footer-logo">
        <span class="footer-title">CNA Scorecard</span>
      </div>
      <div class="footer-links">
        <a href="https://rogolabs.net" target="_blank">RogoLabs</a>
        <a href="https://patchthis.app" target="_blank">PatchThis</a>
        <a href="https://cveforecast.org" target="_blank">CVEForecast</a>
        <a href="https://cve.icu" target="_blank">CVE.ICU</a>
      </div>
    </div>
    <div class="footer-meta">&copy; 2025 RogoLabs. All rights reserved.</div>
  </footer>
  <script src="cve-leaderboard.js"></script>
  <script src="../shared/summary-cards.js"></script>
</body>
</html>
