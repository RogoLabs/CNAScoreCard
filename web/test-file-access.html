<!DOCTYPE html>
<html>
<head>
    <title>File Access Test</title>
</head>
<body>
    <h1>File Access Test</h1>
    <div id="results"></div>
    
    <script>
        async function testFileAccess() {
            const results = document.getElementById('results');
            
            // Test different paths
            const testPaths = [
                '/data/completeness/adobe_completeness.json',
                'data/completeness/adobe_completeness.json',
                './data/completeness/adobe_completeness.json',
                '../data/completeness/adobe_completeness.json'
            ];
            
            for (const path of testPaths) {
                try {
                    console.log(`Testing path: ${path}`);
                    const response = await fetch(path);
                    const status = response.ok ? 'SUCCESS' : `FAILED (${response.status})`;
                    results.innerHTML += `<p><strong>${path}</strong>: ${status}</p>`;
                    
                    if (response.ok) {
                        const data = await response.json();
                        results.innerHTML += `<p>  → Loaded ${data.length} fields</p>`;
                        break; // Stop on first success
                    }
                } catch (error) {
                    results.innerHTML += `<p><strong>${path}</strong>: ERROR - ${error.message}</p>`;
                }
            }
        }
        
        // Run test when page loads
        testFileAccess();
    </script>
</body>
</html>
